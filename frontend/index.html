<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>two-agent-chat</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 760px; margin: 28px auto; padding: 0 18px; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .muted { color: #666; font-size: 13px; line-height: 1.35; }
  section { border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  h2 { font-size: 15px; margin: 0 0 10px 0; }
  button {
    padding: 8px 14px;
    border: 1px solid #333;
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  textarea#topic-input {
    width: 100%;
    box-sizing: border-box;
    min-height: 100px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #bdbdbd;
    border-radius: 8px;
    line-height: 1.45;
    resize: vertical;
  }
  .persona-card { border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: #fafafa; }
  .persona-card h3 { margin: 0 0 6px 0; font-size: 15px; font-weight: 600; }
  .field { font-size: 13px; margin: 6px 0; line-height: 1.4; }
  .label { color: #444; font-weight: 600; }
  #transcript .turn { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; line-height: 1.45; }
  #transcript .turn:last-child { border-bottom: none; }
  #transcript .turn.loading {
    border-bottom: 1px solid #eee;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .speaker { font-weight: 600; color: #1a73e8; }
  .meta { font-size: 11px; color: #888; margin-bottom: 6px; line-height: 1.5; }
  .meta .meta-bc { color: #2e7d32; font-weight: 600; }
  .meta .meta-df { color: #e65100; font-weight: 600; }
  .meta .meta-df-type { font-weight: 500; }
  .meta .meta-df-type-filled_pause { color: #e65100; }
  .meta .meta-df-type-discourse_marker { color: #6a1b9a; }
  .meta .meta-df-type-prolongation { color: #00796b; }
  .meta .meta-df-type-self_repair { color: #c62828; }
  .meta .meta-df-type-repetition { color: #3949ab; }
  .segmented-body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.45;
    margin-top: 2px;
  }
  .segmented-body .backchannel-inline {
    color: #2e7d32;
    font-size: 13px;
  }
  .segmented-body .backchannel-label {
    font-weight: 600;
    font-style: italic;
  }
  .disfluency {
    font-weight: 600;
    border-radius: 4px;
    padding: 0 2px;
  }
  .disfluency-filled_pause {
    color: #e65100;
    background: #fff3e0;
  }
  .disfluency-discourse_marker {
    color: #6a1b9a;
    background: #f3e5f5;
  }
  .disfluency-prolongation {
    color: #00796b;
    background: #b2dfdb;
  }
  .disfluency-self_repair {
    color: #c62828;
    background: #ffebee;
  }
  .disfluency-repetition {
    color: #3949ab;
    background: #e8eaf6;
  }
  .expr-tag {
    color: #1565c0;
    background: #e3f2fd;
    font-weight: 700;
    font-size: 12px;
    border-radius: 4px;
    padding: 0 3px;
    font-style: italic;
  }
  .meta-expr {
    color: #1565c0;
    font-weight: 600;
  }
  .timings-block {
    margin-top: 8px;
    padding: 8px 10px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    color: #555;
  }
  .timings-block .timing-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .timings-block .timing-label { font-weight: 600; color: #444; }
  .timings-block .timing-total { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; font-weight: 600; color: #333; }
  .tts-lines { margin-top: 6px; }
  .tts-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin: 3px 0;
    font-size: 11px;
  }
  .tts-line.backchannel { color: #2e7d32; }
  .tts-line.turn { color: #0d47a1; font-weight: 600; }
  .tts-line.segment-boundary { color: #666; font-size: 10px; padding-left: 12px; }
  .tts-line .play-btn {
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid #bbb;
    background: #fff;
    cursor: pointer;
  }
  .tts-line .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .audio-clips { margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
  .audio-clips h3 { margin: 0 0 8px 0; font-size: 13px; color: #444; }
  .audio-clip { margin: 8px 0 12px; }
  .audio-clip .audio-label { font-size: 11px; color: #666; font-weight: 600; margin-bottom: 2px; }
  .audio-clip .audio-text { font-size: 12px; color: #333; margin-bottom: 4px; }
  .audio-clip audio { width: 100%; max-width: 420px; height: 32px; }
  .speech-gap {
    margin: 6px 0 4px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .speech-gap-fast {
    background: linear-gradient(90deg, #e8f5e9 0%, #a5d6a7 100%);
    color: #1b5e20;
    box-shadow: inset 4px 0 0 #2e7d32;
  }
  .speech-gap-mid {
    background: linear-gradient(90deg, #fff8e1 0%, #ffcc80 100%);
    color: #e65100;
    box-shadow: inset 4px 0 0 #f57c00;
  }
  .speech-gap-slow {
    background: linear-gradient(90deg, #fce4ec 0%, #f48fb1 100%);
    color: #880e4f;
    box-shadow: inset 4px 0 0 #e91e63;
  }
  body.debug-hidden .timings-block,
  body.debug-hidden .meta,
  body.debug-hidden .unit-gap-indicator,
  body.debug-hidden .speech-gap { display: none; }
  .unit-gap-indicator {
    display: block;
    font-size: 10px;
    color: #999;
    padding: 1px 0 1px 18px;
    line-height: 1.3;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .controls.conversation-controls { margin-top: 0; margin-bottom: 0; }
  .conversation-toolbar { margin-bottom: 12px; }
  .grow { flex: 1; min-width: 200px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
<h1>Two-agent dialogue</h1>

<section id="topic-section">
  <h2>Discussion topic</h2>
  <label class="muted" for="topic-input">Edit the topic below. If empty when generating personas or starting, the server default from <code>backend/prompts.py</code> is used.</label>
  <textarea id="topic-input" placeholder="Enter a discussion topic…" spellcheck="true"></textarea>
  <div class="controls">
    <button id="reload-default-topic-btn" type="button" title="Reset textarea to API default topic">Reset to default topic</button>
    <button id="generate-personas-btn" class="primary" type="button">Generate personas from topic</button>
    <span id="generate-personas-status" class="muted"></span>
  </div>
  <div class="controls" style="margin-top:8px">
    <label class="muted"><input type="checkbox" id="tts-enabled" checked /> ElevenLabs TTS (play audio)</label>
    <label class="muted"><input type="checkbox" id="auto-advance" checked /> After start, reveal remaining turns automatically</label>
  </div>
</section>

<section id="personas-section">
  <h2>Agents</h2>
  <div id="personas-list">
    <p class="muted" id="personas-empty-hint">Generate personas from topic above to display agents here.</p>
  </div>
  <div class="controls" style="margin-top:12px">
    <button id="start-btn" class="primary" type="button">Start conversation</button>
  </div>
</section>

<section id="conversation-section">
  <h2>Transcript</h2>
  <div class="muted" id="session-line" style="margin-bottom:8px"></div>
  <div class="conversation-toolbar">
    <div class="controls conversation-controls">
      <button id="next-btn" type="button" disabled>Next turn</button>
      <button id="auto-btn" type="button" disabled>Run remaining turns</button>
      <button id="stop-chain-btn" type="button" disabled title="Stop requesting further turns (finishes current request first)">Stop generation</button>
      <button id="save-export-btn" type="button" disabled title="Download transcript as a single HTML file with embedded audio">Save HTML &amp; audio</button>
      <button id="save-clean-transcript-btn" type="button" disabled title="Download transcript using text before disfluencies were added">Save clean transcript</button>
      <button id="save-audio-mp3-btn" type="button" disabled title="Download all turn audio merged into a single MP3 file">Download full audio (MP3)</button>
      <span id="save-export-status" class="muted"></span>
    </div>
    <p class="muted" style="margin-top:8px;font-size:12px;margin-bottom:0"><strong>Stop generation</strong> cancels the automatic chain only: any request already in flight will still complete.</p>
  </div>
  <div id="transcript"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const opts = { method: body ? "POST" : "GET", headers: {} };
  if (body !== undefined && body !== null) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

let loadingRowEl = null;

function removeLoadingRow() {
  if (loadingRowEl?.parentNode) loadingRowEl.remove();
  loadingRowEl = null;
}

function appendLoadingRow(message) {
  removeLoadingRow();
  const row = document.createElement("div");
  row.className = "turn loading";
  row.innerHTML = `<div class="meta">Generating</div><span class="muted">${escapeHtml(message)}</span>`;
  $("transcript").appendChild(row);
  loadingRowEl = row;
  row.scrollIntoView({ behavior: "smooth", block: "end" });
}

function personaCards(agents) {
  if (!Array.isArray(agents) || !agents.length) {
    $("personas-list").innerHTML =
      '<p class="muted" id="personas-empty-hint">Generate personas from topic above to display agents here.</p>';
    return;
  }
  $("personas-list").innerHTML = agents.map((p) => {
    const styleBit =
      p.verbal_style_id != null && String(p.verbal_style_id).trim() !== ""
        ? `<span class="muted"> · ${escapeHtml(p.verbal_style_id)}</span>`
        : "";
    return `
    <article class="persona-card">
      <h3>${escapeHtml(p.name)}${styleBit}</h3>
      <div class="field"><span class="label">Initial view:&nbsp;</span>${escapeHtml(p.initial_view)}</div>
      <div class="field"><span class="label">Personal story:&nbsp;</span>${escapeHtml(p.personal_story)}</div>
    </article>`;
  }).join("");
}

const DISFLUENCY_LABELS = {
  filled_pause: "filled pause",
  discourse_marker: "discourse marker",
  prolongation: "prolongation",
  self_repair: "self-repair",
  repetition: "repetition",
};

const TAG_MARKER_OPEN = "\uFFF0";
const TAG_MARKER_CLOSE = "\uFFF1";

function highlightDisfluencies(spokenSeg, disfluenciesOnSeg) {
  if (!disfluenciesOnSeg.length) return escapeHtml(spokenSeg);

  const located = [];
  let searchFrom = 0;
  for (const d of disfluenciesOnSeg) {
    const raw = String(d.insert || d.text || "").trim();
    if (!raw) continue;
    let idx = spokenSeg.indexOf(raw, searchFrom);
    if (idx < 0) {
      idx = spokenSeg.toLowerCase().indexOf(raw.toLowerCase(), searchFrom);
    }
    if (idx < 0) continue;
    const insert = spokenSeg.slice(idx, idx + raw.length);
    located.push({ insert, type: d.type || "filled_pause", idx });
    searchFrom = idx + insert.length;
  }
  located.sort((a, b) => a.idx - b.idx);

  let out = "";
  let pos = 0;
  for (const d of located) {
    if (d.idx > pos) out += escapeHtml(spokenSeg.slice(pos, d.idx));
    const label = DISFLUENCY_LABELS[d.type] || d.type.replaceAll("_", " ");
    out += `<span class="disfluency disfluency-${escapeHtml(d.type)}">${escapeHtml(d.insert)} [${escapeHtml(label)}]</span>`;
    pos = d.idx + d.insert.length;
  }
  if (pos < spokenSeg.length) out += escapeHtml(spokenSeg.slice(pos));
  return out;
}

function normalizeSpoken(s) {
  return String(s).replace(/\s+/g, " ").trim();
}

/** Align expressive (with [tags]) to spoken text; embed private markers for tag positions. */
function embedExpressionTagMarkers(spokenSeg, expressiveSeg) {
  if (!expressiveSeg || expressiveSeg.trim() === spokenSeg.trim()) return spokenSeg;

  const stripped = expressiveSeg.replace(/\[[^\]]+\]/g, "");
  if (normalizeSpoken(stripped) !== normalizeSpoken(spokenSeg)) return spokenSeg;

  const parts = String(expressiveSeg).split(/(\[[^\]]+\])/g);
  let si = 0;
  let out = "";
  for (const p of parts) {
    if (!p) continue;
    if (/^\[[^\]]+\]$/.test(p)) {
      out += `${TAG_MARKER_OPEN}${p}${TAG_MARKER_CLOSE}`;
        continue;
      }
    if (spokenSeg.startsWith(p, si)) {
      out += p;
      si += p.length;
      continue;
    }
    const trimmed = p.trimStart();
    const lead = p.length - trimmed.length;
    si += lead;
    if (spokenSeg.startsWith(trimmed, si)) {
      out += spokenSeg.slice(si, si + trimmed.length);
      si += trimmed.length;
    } else {
      return spokenSeg;
    }
  }
  if (si < spokenSeg.length) out += spokenSeg.slice(si);
  return out;
}

function leadingExpressionTagsHtml(expressiveSeg) {
  const m = String(expressiveSeg).match(/^((?:\[[^\]]+\]\s*)+)/);
  if (!m) return "";
  return m[1]
    .split(/(\[[^\]]+\])/g)
    .filter((p) => /^\[[^\]]+\]$/.test(p))
    .map((p) => `<span class="expr-tag">${escapeHtml(p)}</span>`)
    .join(" ");
}

function renderExpressionTagMarkers(html) {
  const re = new RegExp(`${TAG_MARKER_OPEN}(\\[[^\\]]+\\])${TAG_MARKER_CLOSE}`, "g");
  return html.replace(re, (_, tag) => `<span class="expr-tag">${escapeHtml(tag)}</span>`);
}

function renderSegmentBody(spokenSeg, expressiveSeg, dfList) {
  const marked = embedExpressionTagMarkers(spokenSeg, expressiveSeg);
  let html = dfList.length ? highlightDisfluencies(marked, dfList) : escapeHtml(marked);
  html = renderExpressionTagMarkers(html);

  if (marked === spokenSeg && expressiveSeg && expressiveSeg.trim() !== spokenSeg.trim()) {
    const prefix = leadingExpressionTagsHtml(expressiveSeg);
    if (prefix) html = `${prefix} ${html}`;
  }
  return html;
}

function renderTurnDisplay(entry) {
  const speaker = entry.speaker || "";
  const listener = entry.listener || "";
  const backchannels = Array.isArray(entry.backchannels) ? entry.backchannels : [];
  const disfluencies = Array.isArray(entry.disfluencies) ? entry.disfluencies : [];

  const unitsExpressive = entry.units_expressive;
  const ttsUnits = entry.tts_units;
  const unitMicro = entry.unit_micro_indices;
  const segmentsForTts = entry.segments_for_tts;

  if (
    Array.isArray(unitsExpressive) && unitsExpressive.length > 0
    && Array.isArray(ttsUnits) && ttsUnits.length === unitsExpressive.length
    && Array.isArray(unitMicro) && unitMicro.length === unitsExpressive.length
  ) {
    return unitsExpressive.map((expressiveUnit, ui) => {
      const microIdxs = (unitMicro[ui] || []).map(Number);
      const spokenUnit = ttsUnits[ui] || expressiveUnit;
      const dfList = disfluencies.filter((d) => microIdxs.includes(Number(d.segment_index)));
      const body = renderSegmentBody(spokenUnit, expressiveUnit, dfList);
      let line = `<span class="speaker">${escapeHtml(speaker)}:</span> ${body}`;
      const bc = backchannels.find(
        (b) => Number(b.tts_unit_index) === ui
          || microIdxs.includes(Number(b.segment_index))
      );
      if (bc) {
        const who = escapeHtml(bc.listener || listener);
        const bcBody = renderSegmentBody(bc.text, bc.text_for_tts, []);
        line += ` <span class="backchannel-inline">(<span class="backchannel-label">Backchannel</span> ${who}: ${bcBody})</span>`;
      }
      return `<div class="tts-unit-line" data-unit-idx="${ui}">${line}</div>`;
    }).join("");
  }

  const segments = entry.segments;
  const segmentsExpressive = entry.segments_expressive;

  if (Array.isArray(segments) && segments.length > 0) {
    const bcByIdx = new Map(
      backchannels.map((bc) => [Number(bc.segment_index), bc])
    );
    const dfByIdx = new Map();
    for (const df of disfluencies) {
      const idx = Number(df.segment_index);
      if (!dfByIdx.has(idx)) dfByIdx.set(idx, []);
      dfByIdx.get(idx).push(df);
    }
    const spoken =
      Array.isArray(segmentsForTts) && segmentsForTts.length === segments.length
        ? segmentsForTts
        : segments;
    const expressive =
      Array.isArray(segmentsExpressive) && segmentsExpressive.length === segments.length
        ? segmentsExpressive
        : null;

    return segments.map((seg, i) => {
      const spokenSeg = spoken[i] || seg;
      const expressiveSeg = expressive ? expressive[i] : null;
      const dfList = dfByIdx.get(i) || [];
      const body = renderSegmentBody(spokenSeg, expressiveSeg, dfList);
      let line = `<span class="speaker">${escapeHtml(speaker)}:</span> ${body}`;
      const bc = bcByIdx.get(i);
      if (bc) {
        const who = escapeHtml(bc.listener || listener);
        const bcBody = renderSegmentBody(bc.text, bc.text_for_tts, []);
        line += ` <span class="backchannel-inline">(<span class="backchannel-label">Backchannel</span> ${who}: ${bcBody})</span>`;
      }
      return line;
    }).join("<br/>");
  }

  const chunk =
    typeof entry.segmented_dialogue === "string" && entry.segmented_dialogue.trim().length > 0
      ? entry.segmented_dialogue
      : `${speaker}: ${entry.text || ""}`;
  return escapeHtml(chunk).replace(/\n/g, "<br/>");
}

function formatMs(ms) {
  if (ms === undefined || ms === null) return "—";
  const n = Number(ms);
  if (Number.isNaN(n)) return "—";
  if (n >= 1000) return `${(n / 1000).toFixed(2)}s`;
  return `${n}ms`;
}

function renderTimingsBlock(entry, opts = {}) {
  const { forExport = false } = opts;
  const t = entry.timings;
  if (!t || typeof t !== "object") return "";

  const rows = [
    ["Response", t.text_generation_ms],
    ["Split segments", t.segment_ms],
    ["Insert backchannels", t.backchannel_ms],
    ["Insert disfluencies", t.disfluency_ms],
    ["Expression tags", t.expression_ms],
  ];
  if (t.tts_requested) {
    if (t.tts_streaming && !t.tts_synthesized) {
      rows.push(["TTS", "streaming…"]);
    } else if (t.tts_synthesized) {
      rows.push(["TTS (wall)", t.tts_wall_ms]);
      rows.push(["TTS (API sum)", t.tts_total_ms]);
    } else {
      rows.push(["TTS", "failed / missing key"]);
    }
  } else {
    rows.push(["TTS", "off"]);
  }

  let html = `<div class="timings-block"><div class="timing-row">`;
  html += rows.map(([label, val]) =>
    `<span><span class="timing-label">${escapeHtml(label)}:</span> ${escapeHtml(formatMs(val))}</span>`
  ).join("");
  html += `</div>`;

  const lines = Array.isArray(t.tts_lines) ? t.tts_lines : [];
  const audioLines = entry.audio_lines || [];
  if (lines.length > 0) {
    html += `<div class="tts-lines">`;
    lines.forEach((ln) => {
      const isBc = ln.kind === "backchannel";
      const isTurn = ln.kind === "turn";
      const isBoundary = ln.kind === "segment";
      const cls = isBc
        ? "tts-line backchannel"
        : isTurn
          ? "tts-line turn"
          : isBoundary
            ? "tts-line segment-boundary"
            : "tts-line";
      const label = ln.label || (isBc ? `bc @ ${ln.segment_index}` : isTurn ? "speaker turn" : `seg ${ln.segment_index}`);
      const audioLine = isBoundary
        ? null
        : audioLines.find(
            (a) => a.kind === ln.kind && Number(a.segment_index) === Number(ln.segment_index)
          );
      html += `<div class="${cls}">`;
      html += `<span class="timing-label">${escapeHtml(label)}</span>`;
      html += `<span>API ${escapeHtml(formatMs(ln.api_ms))}</span>`;
      html += `<span>clip ${escapeHtml(String(ln.duration_s ?? 0))}s</span>`;
      if (!forExport && audioLine?.audio_base64) {
        html += `<button type="button" class="play-btn" data-kind="${escapeHtml(ln.kind)}" data-seg-idx="${Number(ln.segment_index)}">▶ play</button>`;
      } else if (!forExport && audioLine?.error) {
        html += `<span class="muted">err: ${escapeHtml(audioLine.error)}</span>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }

  html += `<div class="timing-total">Total turn: ${escapeHtml(formatMs(t.total_ms))}`;
  if (t.prefetched) html += ` · <span class="timing-label">prefetched</span>`;
  if (t.wait_ms > 0) html += ` · wait ${escapeHtml(formatMs(t.wait_ms))}`;
  html += `</div>`;
  html += `</div>`;
  return html;
}

function wireAudioButtons(row, entry) {
  const lines = entry.audio_lines || [];
  row.querySelectorAll(".play-btn[data-kind]").forEach((btn) => {
    btn.onclick = () => {
      const kind = btn.dataset.kind;
      const segIdx = Number(btn.dataset.segIdx);
      const line = lines.find(
        (a) => a.kind === kind && Number(a.segment_index) === segIdx
      );
      if (!line?.audio_base64) return;
      const audio = new Audio(`data:audio/mpeg;base64,${line.audio_base64}`);
      audio.volume = kind === "backchannel" ? BACKCHANNEL_VOLUME : 1.0;
      btn.disabled = true;
      audio.onended = () => { btn.disabled = false; };
      audio.onerror = () => { btn.disabled = false; };
      audio.play().catch(() => { btn.disabled = false; });
    };
  });
}

function renderTurnMeta(entry) {
  const n = entry.turn;
  let html = `<strong>Turn ${escapeHtml(n)}</strong>`;

  const bcs = Array.isArray(entry.backchannels) ? entry.backchannels : [];
  const bcMax = entry.backchannel_max;
  if (bcs.length > 0) {
    const bcBits = bcs
      .map((bc) => `@${Number(bc.segment_index)} "${escapeHtml(bc.text)}"`)
      .join(", ");
    html += ` · <span class="meta-bc">bc: ${bcBits}</span>`;
  } else if (bcMax !== undefined && bcMax !== null) {
    html += ` · <span class="meta-bc">bc: none</span> <span class="muted">(max ${escapeHtml(bcMax)})</span>`;
  }

  const dfs = Array.isArray(entry.disfluencies) ? entry.disfluencies : [];
  if (dfs.length > 0) {
    const typeBits = dfs.map((d) => {
      const t = d.type || "filled_pause";
      const label = DISFLUENCY_LABELS[t] || t.replaceAll("_", " ");
      return `<span class="meta-df-type meta-df-type-${escapeHtml(t)}">${escapeHtml(label)}</span>`;
    }).join(", ");
    html += ` · <span class="meta-df">df: ${escapeHtml(String(dfs.length))}</span> (${typeBits})`;
  } else if (entry.disfluency_count > 0) {
    html += ` · <span class="meta-df">df: ${escapeHtml(String(entry.disfluency_count))}</span> <span class="muted">(none matched)</span>`;
  }

  const exprs = Array.isArray(entry.expressions) ? entry.expressions : [];
  if (Array.isArray(entry.units_expressive) && entry.units_expressive.length > 0) {
    const tagBits = entry.units_expressive
      .map((unit, ui) => {
        const tags = [...String(unit).matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]);
        if (!tags.length) return "";
        const label = tags.map((t) => `[${t}]`).join(" ");
        return `@unit${ui} ${escapeHtml(label)}`;
      })
      .filter(Boolean)
      .join(", ");
    if (tagBits) html += ` · <span class="meta-expr">expr: ${tagBits}</span>`;
  } else if (exprs.length > 0) {
    const tagBits = exprs
      .map((e) => {
        const tags = Array.isArray(e.tags) ? e.tags.filter(Boolean) : [];
        const label = tags.length ? tags.map((t) => `[${t}]`).join(" ") : "tagged";
        return `@${Number(e.segment_index)} ${escapeHtml(label)}`;
      })
      .join(", ");
    html += ` · <span class="meta-expr">expr: ${tagBits}</span>`;
  }

  return html;
}

let sessionId = null;
/** Session metadata + turns collected for export. */
let sessionExportMeta = null;
let sessionTurns = [];
/** While true, `runRemainingTurnsAutomatically` exits after the current `/next_turn` finishes. */
let stopChainRequested = false;
let sessionTtsEnabled = false;
let sessionDebugEnabled = false;
let sessionPauseAndGapEnabled = false;
const activeAudios = new Set();
const activeBcTimeouts = new Set();
let audioPlayAborted = false;
/** Timestamp (performance.now) when the last clip of the previous turn finished. */
let lastTurnAudioEndedAt = null;

function abortAudioPlayback() {
  audioPlayAborted = true;
  lastTurnAudioEndedAt = null;
  for (const id of activeBcTimeouts) clearTimeout(id);
  activeBcTimeouts.clear();
  for (const audio of activeAudios) {
    audio.pause();
    audio.src = "";
  }
  activeAudios.clear();
}

function setTtsToggleLocked(locked) {
  $("tts-enabled").disabled = locked;
}

/** Backchannel playback volume (ElevenLabs has no per-request volume API). */
const BACKCHANNEL_VOLUME = 0.9;
/** Delay before backchannel audio: N(mean, std) seconds. */
const BC_DELAY_MEAN_S = 0.2;
const BC_DELAY_STD_S = 0.02;
/** Inter-turn gap: N(200ms, ~50ms std), clamped to [100, 300]ms. */
const TURN_GAP_MEAN_MS = 200;
const TURN_GAP_STD_MS = 50;
const TURN_GAP_MIN_MS = 100;
const TURN_GAP_MAX_MS = 300;
/** Intra-turn gap between TTS units: N(580ms, ~200ms std), clamped to [180, 980]ms. */
const UNIT_GAP_MEAN_MS = 580;
const UNIT_GAP_STD_MS = 200;
const UNIT_GAP_MIN_MS = 180;
const UNIT_GAP_MAX_MS = 980;

function sampleBackchannelDelayMs() {
  const u1 = Math.random();
  const u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-10))) * Math.cos(2 * Math.PI * u2);
  const sec = BC_DELAY_MEAN_S + BC_DELAY_STD_S * z;
  return Math.round(Math.max(0, sec) * 1000);
}

function sampleInterTurnGapMs() {
  const u1 = Math.random();
  const u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-10))) * Math.cos(2 * Math.PI * u2);
  const ms = TURN_GAP_MEAN_MS + TURN_GAP_STD_MS * z;
  return Math.round(Math.min(TURN_GAP_MAX_MS, Math.max(TURN_GAP_MIN_MS, ms)));
}

function sampleUnitGapMs() {
  const u1 = Math.random();
  const u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-10))) * Math.cos(2 * Math.PI * u2);
  const ms = UNIT_GAP_MEAN_MS + UNIT_GAP_STD_MS * z;
  return Math.round(Math.min(UNIT_GAP_MAX_MS, Math.max(UNIT_GAP_MIN_MS, ms)));
}

function sleepMs(ms) {
  return new Promise((resolve) => {
    if (ms <= 0 || audioPlayAborted) {
      resolve();
      return;
    }
    setTimeout(resolve, ms);
  });
}

async function playBackchannelAfterDelay(bc) {
  const delayMs = sampleBackchannelDelayMs();
  await sleepMs(delayMs);
  if (audioPlayAborted || stopChainRequested) return;
  await playAudioBase64(bc.audio_base64, { volume: BACKCHANNEL_VOLUME });
}

function playAudioBase64(b64, opts = {}) {
  const { onPlayStart = null, volume = 1.0 } = opts;
  return new Promise((resolve) => {
    if (audioPlayAborted) {
      resolve();
      return;
    }
    const audio = new Audio(`data:audio/mpeg;base64,${b64}`);
    audio.volume = Math.min(1, Math.max(0, volume));
    activeAudios.add(audio);
    let playStartCalled = false;
    const firePlayStart = () => {
      if (playStartCalled || !onPlayStart) return;
      playStartCalled = true;
      onPlayStart();
    };
    const done = () => {
      activeAudios.delete(audio);
      resolve();
    };
    audio.onplaying = firePlayStart;
    audio.onended = done;
    audio.onerror = done;
    audio.play().then(firePlayStart).catch(done);
  });
}

/** Index legacy per-segment clips for fallback playback. */
function groupTurnAudioLines(lines) {
  const segs = new Map();
  const bcs = new Map();
  for (const line of lines) {
    const idx = Number(line.segment_index);
    if (line.kind === "segment") segs.set(idx, line);
    else if (line.kind === "backchannel") bcs.set(idx, line);
  }
  const segIndices = [...segs.keys()].sort((a, b) => a - b);
  return { segs, bcs, segIndices };
}

function scheduleBackchannelsForTurn(turnLine, bcByIdx) {
  const timings = Array.isArray(turnLine.segment_timings) ? turnLine.segment_timings : [];
  for (const [idx, bc] of bcByIdx) {
    const st = timings.find((t) => Number(t.segment_index) === Number(idx));
    if (!st) continue;
    const delayMs = Number(st.end_s) * 1000 + sampleBackchannelDelayMs();
    const tid = setTimeout(() => {
      activeBcTimeouts.delete(tid);
      if (audioPlayAborted || stopChainRequested) return;
      playAudioBase64(bc.audio_base64, { volume: BACKCHANNEL_VOLUME });
    }, Math.max(0, delayMs));
    activeBcTimeouts.add(tid);
  }
}

async function playContinuousTurnAudio(turnLine, bcByIdx, onTurnFirstPlay) {
  await playAudioBase64(turnLine.audio_base64, {
    volume: 1.0,
    onPlayStart: () => {
      if (onTurnFirstPlay) onTurnFirstPlay();
      scheduleBackchannelsForTurn(turnLine, bcByIdx);
    },
  });
}

/** Poll until a TTS unit clip is ready (or the turn TTS job finishes). */
async function waitForTurnAudio(sessionId, turnNo, bucket, idx, opts = {}) {
  const { optional = false } = opts;
  const maxAttempts = 600;
  for (let i = 0; i < maxAttempts; i++) {
    if (audioPlayAborted || stopChainRequested) return null;
    const res = await api(
      `/turn_audio?session_id=${encodeURIComponent(sessionId)}&turn=${turnNo}`
    );
    const line = res[bucket]?.[String(idx)];
    if (line?.audio_base64) return line;
    if (res.complete) {
      if (line) return line;
      return optional ? null : null;
    }
    await sleepMs(150);
  }
  return null;
}

function mergeTurnAudioPollIntoEntry(entry, poll) {
  if (!poll || typeof poll !== "object") return;
  entry.timings = entry.timings || {};
  if (Array.isArray(poll.tts_line_timings) && poll.tts_line_timings.length) {
    entry.timings.tts_lines = poll.tts_line_timings;
  }
  if (poll.complete) {
    entry.timings.tts_synthesized = true;
    entry.timings.tts_streaming = false;
    if (poll.tts_total_ms != null) entry.timings.tts_total_ms = poll.tts_total_ms;
  }
  const audioLines = [];
  const segMap = poll.segments || {};
  const bcMap = poll.backchannels || {};
  const segKeys = Object.keys(segMap).map(Number).sort((a, b) => a - b);
  for (const ui of segKeys) {
    audioLines.push(segMap[String(ui)]);
    const bc = bcMap[String(ui)];
    if (bc) audioLines.push(bc);
  }
  if (audioLines.length) entry.audio_lines = audioLines;
  entry.tts_streaming = !poll.complete;
}

function cloneTurnEntry(entry) {
  return JSON.parse(JSON.stringify(entry));
}

function recordTurn(entry) {
  if (!entry || entry.turn == null) return;
  const copy = cloneTurnEntry(entry);
  const idx = sessionTurns.findIndex((t) => Number(t.turn) === Number(copy.turn));
  if (idx >= 0) sessionTurns[idx] = { ...sessionTurns[idx], ...copy };
  else sessionTurns.push(copy);
  sessionTurns.sort((a, b) => Number(a.turn) - Number(b.turn));
  updateSaveExportButton();
}

function updateSaveExportButton() {
  const enabled = sessionTurns.length > 0;
  $("save-export-btn").disabled = !enabled;
  $("save-clean-transcript-btn").disabled = !enabled;
  $("save-audio-mp3-btn").disabled = !enabled;
}

/** Spoken text from clean segments (after split, before disfluency). */
function cleanTurnSpokenText(entry) {
  const segments = entry.segments;
  if (Array.isArray(segments) && segments.length) {
    return segments.map((s) => String(s).trim()).filter(Boolean).join(" ");
  }
  return String(entry.text || "").trim();
}

    );

function saveCleanTranscriptExport() {
  if (!sessionTurns.length) return;

  const meta = {
    ...(sessionExportMeta || {}),
    exported_at: new Date().toISOString(),
  };
  const html = buildCleanTranscriptHtml(meta, sessionTurns);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const stamp = meta.session_id || String(Date.now());
  downloadBlob(blob, `transcript-clean-${stamp}.html`);
  $("save-export-status").textContent = "Clean transcript saved.";
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function ensureTurnAudioCollected(entry) {
  const copy = cloneTurnEntry(entry);
  if (!sessionTtsEnabled || !sessionId) return copy;
  const hasAudio = (copy.audio_lines || []).some((l) => l.audio_base64);
  if (hasAudio && !copy.tts_streaming) return copy;
  try {
    const poll = await api(
      `/turn_audio?session_id=${encodeURIComponent(sessionId)}&turn=${copy.turn}`
    );
    mergeTurnAudioPollIntoEntry(copy, poll);
  } catch (_) {
    /* keep whatever audio we already have */
  }
  return copy;
}

function uint8ToBase64(bytes) {
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = numFrames * blockAlign;
  const arrayBuffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(arrayBuffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytesPerSample * 8, true);
  writeStr(36, "data");
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < numFrames; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      offset += 2;
    }
  }
  return new Uint8Array(arrayBuffer);
}

async function decodeAudioBase64Clip(decodeCtx, b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  return decodeCtx.decodeAudioData(bytes.buffer.slice(0));
}

/** Merge speaker unit clips + backchannels (same overlap timing as live playback). */
async function concatTurnAudioClips(lines) {
  const segs = (lines || [])
    .filter((l) => l.kind === "segment" && l.audio_base64)
    .sort((a, b) => Number(a.segment_index) - Number(b.segment_index));
  if (!segs.length) return null;

  const bcByUnit = new Map();
  for (const line of lines || []) {
    if (line.kind === "backchannel" && line.audio_base64) {
      bcByUnit.set(Number(line.segment_index), line);
    }
  }

  const bcDelayS = BC_DELAY_MEAN_S;
  const bcVolume = BACKCHANNEL_VOLUME;

  const decodeCtx = new AudioContext();
  try {
    const segBuffers = [];
    for (const line of segs) {
      segBuffers.push(await decodeAudioBase64Clip(decodeCtx, line.audio_base64));
    }

    const segStarts = [];
    let cursor = 0;
    for (let i = 0; i < segBuffers.length; i++) {
      if (i > 0) cursor += sessionPauseAndGapEnabled ? sampleUnitGapMs() / 1000 : 0;
      segStarts.push(cursor);
      cursor += segBuffers[i].duration;
    }
    const lastSegEnd = cursor;

    const mixEvents = [];
    for (let i = 0; i < segBuffers.length; i++) {
      mixEvents.push({
        buffer: segBuffers[i],
        startSec: segStarts[i],
        volume: 1.0,
      });
    }

    let totalSec = lastSegEnd;

    for (let j = 1; j < segs.length; j++) {
      const bcIdx = Number(segs[j - 1].segment_index);
      const bcLine = bcByUnit.get(bcIdx);
      if (!bcLine) continue;
      const bcBuf = await decodeAudioBase64Clip(decodeCtx, bcLine.audio_base64);
      const startSec = segStarts[j] + bcDelayS;
      mixEvents.push({ buffer: bcBuf, startSec, volume: bcVolume });
      totalSec = Math.max(totalSec, startSec + bcBuf.duration);
    }

    const trailingIdx = Number(segs[segs.length - 1].segment_index);
    const trailingBc = bcByUnit.get(trailingIdx);
    if (trailingBc) {
      const bcBuf = await decodeAudioBase64Clip(decodeCtx, trailingBc.audio_base64);
      const startSec = lastSegEnd + bcDelayS;
      mixEvents.push({ buffer: bcBuf, startSec, volume: bcVolume });
      totalSec = Math.max(totalSec, startSec + bcBuf.duration);
    }

    const sampleRate = segBuffers[0].sampleRate;
    const channels = segBuffers[0].numberOfChannels;
    const totalFrames = Math.ceil(totalSec * sampleRate);
    const offline = new OfflineAudioContext(channels, totalFrames, sampleRate);

    for (const ev of mixEvents) {
      const src = offline.createBufferSource();
      src.buffer = ev.buffer;
      const gain = offline.createGain();
      gain.gain.value = ev.volume;
      src.connect(gain);
      gain.connect(offline.destination);
      src.start(ev.startSec);
    }

    const rendered = await offline.startRendering();
    const wav = audioBufferToWav(rendered);

    if (mixEvents.length === 1 && !bcByUnit.size) {
      const only = segs[0];
      return {
        src: `data:audio/mpeg;base64,${only.audio_base64}`,
        duration_s: Number(only.duration_s) || rendered.duration,
      };
    }

    return {
      src: `data:audio/wav;base64,${uint8ToBase64(wav)}`,
      duration_s: Math.round(rendered.duration * 1000) / 1000,
    };
  } finally {
    await decodeCtx.close();
  }
}

async function renderTurnToAudioBuffer(lines) {
  const segs = (lines || [])
    .filter((l) => l.kind === "segment" && l.audio_base64)
    .sort((a, b) => Number(a.segment_index) - Number(b.segment_index));
  if (!segs.length) return null;

  const bcByUnit = new Map();
  for (const line of lines || []) {
    if (line.kind === "backchannel" && line.audio_base64) {
      bcByUnit.set(Number(line.segment_index), line);
    }
  }

  const bcDelayS = BC_DELAY_MEAN_S;
  const bcVolume = BACKCHANNEL_VOLUME;
  const decodeCtx = new AudioContext();
  try {
    const segBuffers = [];
    for (const line of segs) {
      segBuffers.push(await decodeAudioBase64Clip(decodeCtx, line.audio_base64));
    }
    const segStarts = [];
    let cursor = 0;
    for (let i = 0; i < segBuffers.length; i++) {
      if (i > 0) cursor += sessionPauseAndGapEnabled ? sampleUnitGapMs() / 1000 : 0;
      segStarts.push(cursor);
      cursor += segBuffers[i].duration;
    }
    const lastSegEnd = cursor;
    const mixEvents = [];
    for (let i = 0; i < segBuffers.length; i++) {
      mixEvents.push({ buffer: segBuffers[i], startSec: segStarts[i], volume: 1.0 });
    }
    let totalSec = lastSegEnd;
    for (let j = 1; j < segs.length; j++) {
      const bcIdx = Number(segs[j - 1].segment_index);
      const bcLine = bcByUnit.get(bcIdx);
      if (!bcLine) continue;
      const bcBuf = await decodeAudioBase64Clip(decodeCtx, bcLine.audio_base64);
      const startSec = segStarts[j] + bcDelayS;
      mixEvents.push({ buffer: bcBuf, startSec, volume: bcVolume });
      totalSec = Math.max(totalSec, startSec + bcBuf.duration);
    }
    const trailingIdx = Number(segs[segs.length - 1].segment_index);
    const trailingBc = bcByUnit.get(trailingIdx);
    if (trailingBc) {
      const bcBuf = await decodeAudioBase64Clip(decodeCtx, trailingBc.audio_base64);
      const startSec = lastSegEnd + bcDelayS;
      mixEvents.push({ buffer: bcBuf, startSec, volume: bcVolume });
      totalSec = Math.max(totalSec, startSec + bcBuf.duration);
    }
    const sampleRate = segBuffers[0].sampleRate;
    const channels = segBuffers[0].numberOfChannels;
    const totalFrames = Math.ceil(totalSec * sampleRate);
    const offline = new OfflineAudioContext(channels, totalFrames, sampleRate);
    for (const ev of mixEvents) {
      const src = offline.createBufferSource();
      src.buffer = ev.buffer;
      const gain = offline.createGain();
      gain.gain.value = ev.volume;
      src.connect(gain);
      gain.connect(offline.destination);
      src.start(ev.startSec);
    }
    return await offline.startRendering();
  } finally {
    await decodeCtx.close();
  }
}

function audioBufferToMp3(buffer, kbps = 128) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  const blockSize = 1152;
  const mp3Data = [];

  const toInt16 = (float32) => {
    const out = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]));
      out[i] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7fff);
    }
    return out;
  };

  if (channels === 1) {
    const samples = toInt16(buffer.getChannelData(0));
    for (let i = 0; i < samples.length; i += blockSize) {
      const chunk = samples.subarray(i, i + blockSize);
      const mp3buf = encoder.encodeBuffer(chunk);
      if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
  } else {
    const left = toInt16(buffer.getChannelData(0));
    const right = toInt16(buffer.getChannelData(1));
    for (let i = 0; i < left.length; i += blockSize) {
      const mp3buf = encoder.encodeBuffer(
        left.subarray(i, i + blockSize),
        right.subarray(i, i + blockSize)
      );
      if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
  }
  const end = encoder.flush();
  if (end.length > 0) mp3Data.push(end);

  let totalLen = 0;
  for (const buf of mp3Data) totalLen += buf.length;
  const result = new Uint8Array(totalLen);
  let offset = 0;
  for (const buf of mp3Data) {
    result.set(buf, offset);
    offset += buf.length;
  }
  return result;
}

async function saveFullAudioMp3() {
  if (!sessionTurns.length) return;

  const btn = $("save-audio-mp3-btn");
  const statusEl = $("save-export-status");
  const prevLabel = btn.textContent;
  btn.disabled = true;
  statusEl.textContent = "Collecting audio for MP3…";

  try {
    const turns = [];
    for (const t of sessionTurns) {
      turns.push(await ensureTurnAudioCollected(t));
    }

    statusEl.textContent = "Rendering turn audio…";
    const turnBuffers = [];
    for (const entry of turns) {
      const buf = await renderTurnToAudioBuffer(entry.audio_lines || []);
      if (buf) turnBuffers.push(buf);
    }

    if (!turnBuffers.length) {
      statusEl.textContent = "No audio to export.";
      return;
    }

    statusEl.textContent = "Stitching all turns…";
    const sampleRate = turnBuffers[0].sampleRate;
    const channels = turnBuffers[0].numberOfChannels;
    const gapFramesPerTransition = [];
    for (let i = 0; i < turnBuffers.length - 1; i++) {
      gapFramesPerTransition.push(sessionPauseAndGapEnabled ? Math.ceil((sampleInterTurnGapMs() / 1000) * sampleRate) : 0);
    }

    let totalFrames = 0;
    for (let i = 0; i < turnBuffers.length; i++) {
      totalFrames += turnBuffers[i].length;
      if (i < turnBuffers.length - 1) totalFrames += gapFramesPerTransition[i];
    }

    const offline = new OfflineAudioContext(channels, totalFrames, sampleRate);
    let offset = 0;
    for (let i = 0; i < turnBuffers.length; i++) {
      const src = offline.createBufferSource();
      src.buffer = turnBuffers[i];
      src.connect(offline.destination);
      src.start(offset / sampleRate);
      offset += turnBuffers[i].length;
      if (i < turnBuffers.length - 1) offset += gapFramesPerTransition[i];
    }
    const fullBuffer = await offline.startRendering();

    statusEl.textContent = "Encoding MP3…";
    const mp3Bytes = audioBufferToMp3(fullBuffer);

    const blob = new Blob([mp3Bytes], { type: "audio/mpeg" });
    const stamp = sessionExportMeta?.session_id || String(Date.now());
    downloadBlob(blob, `dialogue-${stamp}.mp3`);
    statusEl.textContent = "MP3 saved.";
  } catch (e) {
    statusEl.textContent = "";
    alert(e.message || String(e));
  } finally {
    btn.textContent = prevLabel;
    updateSaveExportButton();
  }
}

function renderExportTurnAudio(entry, turnClip) {
  if (!turnClip?.src) return "";
  const speaker = entry.speaker || "Speaker";
  let html = `<div class="audio-clips"><h3>Turn audio</h3>`;
  html += `<div class="audio-clip">`;
  html += `<div class="audio-label">${escapeHtml(speaker)} · ${escapeHtml(String(turnClip.duration_s || 0))}s · includes backchannels</div>`;
  html += `<audio controls preload="metadata" src="${turnClip.src}"></audio>`;
  html += `</div></div>`;
  return html;
}

function buildExportHtml(meta, turns, turnClipsByTurn, fullAudioDataUrl) {
  const topic = meta?.discussion_topic || "";
  const exportedAt = meta?.exported_at || new Date().toISOString();
  const sessionLabel = meta?.session_id || "unknown";
  const ttsBit = meta?.tts_enabled ? "TTS on" : "TTS off";

  let fullAudioBlock = "";
  if (fullAudioDataUrl) {
    fullAudioBlock = `<div class="full-audio"><h2>Full conversation audio</h2><audio controls preload="metadata" src="${fullAudioDataUrl}"></audio></div>`;
  }

  let body = "";
  for (const entry of turns) {
    const turnNo = Number(entry.turn);
    const turnClip = turnClipsByTurn.get(turnNo);
    body += `<article class="turn">`;
    body += `<div class="meta">${renderTurnMeta(entry)}</div>`;
    body += `<div class="segmented-body">${renderTurnDisplay(entry)}</div>`;
    body += renderTimingsBlock(entry, { forExport: true });
    body += renderExportTurnAudio(entry, turnClip);
    body += `</article>`;
  }

  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dialogue export — ${escapeHtml(sessionLabel)}</title>
<style>${exportStylesheet()}</style>
</head>
<body>
<h1>Two-agent dialogue export</h1>
<p class="muted">Topic: <strong>${escapeHtml(topic)}</strong><br/>
Session: <code>${escapeHtml(sessionLabel)}</code> · ${escapeHtml(ttsBit)} · exported ${escapeHtml(exportedAt)}</p>
${fullAudioBlock}
${body}
</body>
</html>`;
}

async function saveConversationExport() {
  if (!sessionTurns.length) return;

  const btn = $("save-export-btn");
  const statusEl = $("save-export-status");
  const prevLabel = btn.textContent;
  btn.disabled = true;
  statusEl.textContent = "Collecting audio…";

  try {
    const turns = [];
    for (const t of sessionTurns) {
      turns.push(await ensureTurnAudioCollected(t));
      recordTurn(turns[turns.length - 1]);
    }

    statusEl.textContent = "Rendering per-turn audio…";
    const turnClipsByTurn = new Map();
    const turnBuffers = [];
    for (const entry of turns) {
      const turnNo = Number(entry.turn);
      const turnClip = await concatTurnAudioClips(entry.audio_lines || []);
      if (turnClip) turnClipsByTurn.set(turnNo, turnClip);
      const buf = await renderTurnToAudioBuffer(entry.audio_lines || []);
      if (buf) turnBuffers.push(buf);
    }

    let fullAudioDataUrl = "";
    if (turnBuffers.length) {
      statusEl.textContent = "Stitching full conversation audio…";
      const sampleRate = turnBuffers[0].sampleRate;
      const channels = turnBuffers[0].numberOfChannels;
      const gapFramesPerTransition = [];
      for (let i = 0; i < turnBuffers.length - 1; i++) {
        gapFramesPerTransition.push(sessionPauseAndGapEnabled ? Math.ceil((sampleInterTurnGapMs() / 1000) * sampleRate) : 0);
      }
      let totalFrames = 0;
      for (let i = 0; i < turnBuffers.length; i++) {
        totalFrames += turnBuffers[i].length;
        if (i < turnBuffers.length - 1) totalFrames += gapFramesPerTransition[i];
      }
      const offline = new OfflineAudioContext(channels, totalFrames, sampleRate);
      let frameOffset = 0;
      for (let i = 0; i < turnBuffers.length; i++) {
        const src = offline.createBufferSource();
        src.buffer = turnBuffers[i];
        src.connect(offline.destination);
        src.start(frameOffset / sampleRate);
        frameOffset += turnBuffers[i].length;
        if (i < turnBuffers.length - 1) frameOffset += gapFramesPerTransition[i];
      }
      const fullBuffer = await offline.startRendering();
      statusEl.textContent = "Encoding full audio…";
      const wav = audioBufferToWav(fullBuffer);
      fullAudioDataUrl = `data:audio/wav;base64,${uint8ToBase64(wav)}`;
    }

    const meta = {
      ...(sessionExportMeta || {}),
      exported_at: new Date().toISOString(),
    };

    statusEl.textContent = "Building HTML…";
    const html = buildExportHtml(meta, turns, turnClipsByTurn, fullAudioDataUrl);
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const stamp = meta.session_id || String(Date.now());
    downloadBlob(blob, `dialogue-${stamp}.html`);
    statusEl.textContent = "Saved.";
  } catch (e) {
    statusEl.textContent = "";
    alert(e.message || String(e));
  } finally {
    btn.textContent = prevLabel;
    updateSaveExportButton();
  }
}

async function refreshTurnTimingsFromStream(entry, row) {
  if (!sessionId || !entry?.turn) return;
  try {

  }

/** Play TTS units sequentially; backchannels overlap the next unit. */
async function playTurnAudioStreaming(entry, row, nUnits) {
  audioPlayAborted = false;
  let gapRecorded = false;
  const onTurnFirstPlay = () => {
    if (gapRecorded || lastTurnAudioEndedAt == null) return;
    gapRecorded = true;
    showSpeechGap(row, Math.round(performance.now() - lastTurnAudioEndedAt));
  };

  for (let ui = 0; ui < nUnits; ui++) {
    if (audioPlayAborted || stopChainRequested) break;

    const segLine = await waitForTurnAudio(sessionId, entry.turn, "segments", ui);
    if (!segLine?.audio_base64) {
      if (segLine) console.warn(`[TTS] unit ${ui} skipped — empty audio. error: ${segLine.error || "unknown"}, text: ${segLine.text}`);
      continue;
    }

    if (ui === 0) {
      await playAudioBase64(segLine.audio_base64, { onPlayStart: onTurnFirstPlay });
      continue;
    }

    if (!audioPlayAborted && !stopChainRequested && sessionPauseAndGapEnabled) {
      const unitGap = sampleUnitGapMs();
      showUnitGap(row, ui - 1, unitGap);
      await sleepMs(unitGap);
    }

    const bcTask = (async () => {
      const bc = await waitForTurnAudio(
        sessionId,
        entry.turn,
        "backchannels",
        ui - 1,
        { optional: true }
      );
      if (bc?.audio_base64 && !audioPlayAborted && !stopChainRequested) {
        await playBackchannelAfterDelay(bc);
      }
    })();
    await Promise.all([
      playAudioBase64(segLine.audio_base64),
      bcTask,
    ]);
  }

  if (nUnits > 0 && !audioPlayAborted && !stopChainRequested) {
    const trailingBc = await waitForTurnAudio(
      sessionId,
      entry.turn,
      "backchannels",
      nUnits - 1,
      { optional: true }
    );
    if (trailingBc?.audio_base64) {
      await playBackchannelAfterDelay(trailingBc);
    }
  }

  await refreshTurnTimingsFromStream(entry, row);
  lastTurnAudioEndedAt = performance.now();
}

/** Legacy: one clip per speaker segment (pre–whole-turn TTS). */
async function playSegmentedTurnAudio(lines, onTurnFirstPlay, nUnits, row) {
  const { segs, bcs } = groupTurnAudioLines(lines);
  const unitCount = nUnits > 0 ? nUnits : [...segs.keys()].length;
  if (!unitCount) return;

  for (let ui = 0; ui < unitCount; ui++) {
    const seg = segs.get(ui);
    if (!seg?.audio_base64) continue;

    if (ui === 0) {
      await playAudioBase64(seg.audio_base64, { onPlayStart: onTurnFirstPlay });
      continue;
    }

    if (!audioPlayAborted && !stopChainRequested && sessionPauseAndGapEnabled) {
      const unitGap = sampleUnitGapMs();
      showUnitGap(row, ui - 1, unitGap);
      await sleepMs(unitGap);
    }

    const bc = bcs.get(ui - 1);
    if (bc?.audio_base64) {
      await Promise.all([
        playBackchannelAfterDelay(bc),
        playAudioBase64(seg.audio_base64),
      ]);
    } else {
      await playAudioBase64(seg.audio_base64);
    }
  }

  const trailingBc = bcs.get(unitCount - 1);
  if (trailingBc?.audio_base64 && !audioPlayAborted && !stopChainRequested) {
    await playBackchannelAfterDelay(trailingBc);
  }
}

/**
 * Play TTS units sequentially; backchannels overlap the next unit.
 */
async function playTurnAudio(entry, row) {
  if (!sessionTtsEnabled) return;
  const nUnits = (entry.tts_units || []).length;

  if (entry.tts_streaming && sessionId && nUnits > 0) {
    return playTurnAudioStreaming(entry, row, nUnits);
  }

  const lines = entry.audio_lines || [];
  if (!lines.length && !nUnits) return;

  audioPlayAborted = false;
  let gapRecorded = false;
  const onTurnFirstPlay = () => {
    if (gapRecorded || lastTurnAudioEndedAt == null) return;
    gapRecorded = true;
    showSpeechGap(row, Math.round(performance.now() - lastTurnAudioEndedAt));
  };

  await playSegmentedTurnAudio(lines, onTurnFirstPlay, nUnits, row);

  lastTurnAudioEndedAt = performance.now();
}

function disableConversation(disabled) {
  $("next-btn").disabled = disabled || !sessionId;
  $("auto-btn").disabled = disabled || !sessionId;
}

function startRequestBody() {
  const body = { tts_enabled: $("tts-enabled").checked };
  const trimmed = $("topic-input").value.trim();
  if (trimmed) body.topic_override = trimmed;
  return body;
}

function updateSessionLine({ session_id, max_turns, discussion_topic, tts_enabled }) {
  const nt = escapeHtml(String(max_turns));
  const ttsBit = tts_enabled
    ? " · <strong>TTS on</strong>"
    : " · TTS off";
  $("session-line").innerHTML =
    `<span title="${escapeHtml(discussion_topic)}">Topic in use:&nbsp;<strong>${escapeHtml(discussion_topic.length > 120 ? discussion_topic.slice(0, 120) + "…" : discussion_topic)}</strong></span>` +
    ` · session <code>${escapeHtml(session_id)}</code> · max ${nt} turns${ttsBit}`;
}

/** Fetch each remaining turn sequentially; pulses a loading row between responses. */
async function runRemainingTurnsAutomatically() {
  let convoEnded = false;
  stopChainRequested = false;
  $("stop-chain-btn").disabled = false;
  try {
    while (sessionId) {
      if (stopChainRequested) {
        removeLoadingRow();
        break;
      }
      appendLoadingRow("Awaiting model for next speaker…");
      const res = await api("/next_turn", { session_id: sessionId });
      removeLoadingRow();
      if (res.turn) {
        const row = appendTurn(res.turn);
        await playTurnAudio(res.turn, row);
      }
      if (res.done) {
        convoEnded = true;
        break;
      }
      if (stopChainRequested) break;
      if (sessionTtsEnabled && !audioPlayAborted && sessionPauseAndGapEnabled) {
        await sleepMs(sampleInterTurnGapMs());
      }
    }
  } catch (e) {
    removeLoadingRow();
    alert(e.message);
  } finally {
    $("stop-chain-btn").disabled = true;
    stopChainRequested = false;
  }
  if (convoEnded) {
    disableConversation(true);
    setTtsToggleLocked(false);
  } else if (sessionId) disableConversation(false);
}

  $("stop-chain-btn").disabled = true;
  stopChainRequested = false;

  sessionExportMeta = null;
  sessionTurns = [];
  updateSaveExportButton();

  sessionTtsEnabled = $("tts-enabled").checked;
  setTtsToggleLocked(true);
  $("session-line").textContent = "";
  try {
    appendLoadingRow(sessionTtsEnabled ? "Generating turn 1 (with TTS)…" : "Generating turn 1…");
    const payload = await api("/start", startRequestBody());
    removeLoadingRow();
    sessionId = payload.session_id;
    sessionTtsEnabled = Boolean(payload.tts_enabled);
    sessionDebugEnabled = Boolean(payload.debug_setting);
    document.body.classList.toggle("debug-hidden", !sessionDebugEnabled);
    sessionPauseAndGapEnabled = Boolean(payload.use_pause_and_gap);
    sessionExportMeta = {
      session_id: payload.session_id,
      discussion_topic: payload.discussion_topic,
      max_turns: payload.max_turns,
      tts_enabled: payload.tts_enabled,
    };
    sessionTurns = [];
    personaCards(payload.personas.agents);
    updateSessionLine(payload);
    const firstRow = appendTurn(payload.turn);
    await playTurnAudio(payload.turn, firstRow);
    if (sessionTtsEnabled && !audioPlayAborted && sessionPauseAndGapEnabled) {
      await sleepMs(sampleInterTurnGapMs());
    }

    if ($("auto-advance").checked) {
      $("next-btn").disabled = true;
      $("auto-btn").disabled = true;
      await runRemainingTurnsAutomatically();
  } else {
      disableConversation(false);
    }
  } catch (e) {
    removeLoadingRow();
    alert(e.message);
    sessionId = null;
    setTtsToggleLocked(false);
    disableConversation(true);
  }
  $("start-btn").disabled = false;
  if (!sessionId) setTtsToggleLocked(false);
};

document.getElementById("stop-chain-btn").onclick = () => {
  stopChainRequested = true;

document.getElementById("next-btn").onclick = async () => {

  $("next-btn").disabled = true;
  $("auto-btn").disabled = true;
  $("stop-chain-btn").disabled = true;

    appendLoadingRow("Awaiting model for next speaker…");

      setTtsToggleLocked(false);
    } else {

    }
  } catch (e) {

    alert(e.message);
    disableConversation(false);
  }
